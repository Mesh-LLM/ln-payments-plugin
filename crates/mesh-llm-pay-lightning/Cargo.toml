[package]
name = "mesh-llm-pay-lightning"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable Lightning admission and settlement runtime for wallet plugins"

[lints]
workspace = true

[dependencies]
anyhow = "1"
prost = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
async-trait = "0.1"
mesh-llm-events = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "cd9edd70c" }
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "cd9edd70c" }
mesh-llm-payments = { path = "../mesh-llm-payments" }
mesh-llm-payments-types = { path = "../mesh-llm-payments-types" }
mesh-llm-wallet = { path = "../mesh-llm-wallet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3", features = ["server"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

tempfile = "3"

[features]
offline-mock = ["dep:bitcoin", "dep:lightning-invoice", "mesh-llm-wallet/plugin-server"]

[[bin]]
name = "pay-lightning-mock"
path = "src/bin/pay-lightning-mock.rs"
required-features = ["offline-mock"]

[dependencies.bitcoin]
version = "0.32"
features = ["secp-recovery"]
optional = true

[dependencies.lightning-invoice]
version = "0.35.0-rc1"
features = ["std"]
optional = true

[dev-dependencies]
bitcoin = { version = "0.32", features = ["secp-recovery"] }
lightning-invoice = { version = "0.35.0-rc1", features = ["std"] }
mesh-llm-plugin-manager = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "cd9edd70c" }
flate2 = "1"
tar = "0.4"
