[package]
name = "mesh-llm-payments-types"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Pure payment data types (pricing, request terms, wire frames) shared by mesh core and mesh-llm-payments"
readme = "README.md"
repository = "https://github.com/Mesh-LLM/mesh-llm"

[lints]
workspace = true

[features]
default = []
# The host/engine seam traits. Pulls in the plugin stream type.
engine = ["dep:mesh-llm-plugin"]

[dependencies]
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "18562397862ba1e30d0f3a40545f5d894a42a69c", optional = true }
anyhow.workspace = true
httparse = "1"
mesh-llm-wallet = { path = "../mesh-llm-wallet" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util"] }
