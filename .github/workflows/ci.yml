name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: fmt + clippy
        run: just check
      - name: test (serial)
        run: just test
      - name: package
        run: just package
      - name: install via mesh-llm plugin-manager (packaged archive + GitHub release)
        env:
          PAY_LIGHTNING_RELEASE_INSTALL: "1"
        run: |
          export PAY_LIGHTNING_ARCHIVE="$(ls "$PWD"/dist/pay-lightning-v*.{zip,tar.gz} 2>/dev/null | head -1)"
          test -n "$PAY_LIGHTNING_ARCHIVE"
          cargo test -p mesh-llm-pay-lightning --all-features --test plugin_install -- --test-threads=1 --nocapture
