name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Jobs run 2 to 12 minutes (cold cache); a hang fails here instead of holding the runner.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # These three steps are `just ci`, the local pre-push check, split for readable logs.
      # Installing the published release needs api.github.com and runs in release-install.yml.
      - name: fmt + clippy
        run: just check
      - name: test
        run: just test
      - name: package + install the archive via mesh-llm plugin-manager
        run: just install-check
